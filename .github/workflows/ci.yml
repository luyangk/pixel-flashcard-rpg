# CI：push / PR 触发一键 verify（typecheck + core purity + test）。
# Pages 部署留给 Plan 5，此处不提前。
name: CI

on: [push, pull_request]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
